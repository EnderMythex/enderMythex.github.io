<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Architecture Mineur Web3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; padding: 20px; }
        button { background: #0f0; color: #000; padding: 10px; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h2>[ ÉTUDE ARCHITECTURE WEB3 MINING ]</h2>
    
    <button id="connectBtn">Connecter MetaMask (Ton Adresse)</button>
    <div id="walletInfo">Non connecté</div>
    <div id="miningStatus" style="margin-top: 20px;"></div>

    <script type="module">
        // 2. Configuration de la Blockchain
        // L'adresse du contrat de la crypto que tu veux miner (ex: le jeton HASH)
        const CONTRACT_ADDRESS = "0xB5Da12E6Ce8DBdA0c8390DB46958F61181C6E381"; 
        
        // L'ABI : Le "manuel d'utilisation" du contrat. Il dit à notre code quelles fonctions existent.
        const CONTRACT_ABI = [
            "function mint(uint256 nonce, bytes32 challenge_digest) external",
            "function getChallengeNumber() public view returns (bytes32)",
            "function getMiningDifficulty() public view returns (uint)"
        ];

        let provider, signer, contract, userAddress;

        // 3. Connexion au Wallet (La réponse à ta question)
        document.getElementById('connectBtn').addEventListener('click', async () => {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    // Demande à MetaMask de se connecter
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                    
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner(); // C'est lui qui signera pour TON adresse
                    userAddress = await signer.getAddress(); // On récupère ton adresse !
                    
                    document.getElementById('walletInfo').innerText = `Adresse liée : ${userAddress}`;
                    
                    // On connecte le contrat avec ton "Signer"
                    contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                    
                    startMiningProcess();
                } catch (error) {
                    console.error("Connexion refusée", error);
                }
            } else {
                alert("MetaMask n'est pas installé !");
            }
        });

        // 4. La logique de Minage
        async function startMiningProcess() {
            document.getElementById('miningStatus').innerText = "Lecture de la blockchain...";
            
            // Étape A : Demander au contrat le problème mathématique actuel
            const challenge = await contract.getChallengeNumber();
            const difficulty = await contract.getMiningDifficulty();
            
            document.getElementById('miningStatus').innerText = "GPU au travail...";

            // Étape B : On envoie le challenge au GPU via WebGPU (Simulation ici)
            const discoveredNonce = await runWebGPUMiner(challenge, difficulty, userAddress);

            if (discoveredNonce) {
                document.getElementById('miningStatus').innerText = "Solution trouvée ! Envoi à la blockchain...";
                
                // Étape C : RÉCLAMER L'ARGENT
                // C'est ici que ton wallet (ton adresse) signe la transaction et paie le gaz
                try {
                    const tx = await contract.mint(discoveredNonce, challenge);
                    document.getElementById('miningStatus').innerText = `Transaction en cours... Hash: ${tx.hash}`;
                    await tx.wait(); // On attend que la blockchain valide
                    document.getElementById('miningStatus').innerText = "Succès ! Les jetons sont sur ton adresse.";
                } catch (err) {
                    console.error("Erreur de transaction (ou gaz trop faible)", err);
                }
            }
        }

        // 5. Le moteur matériel (Le lien avec le GPU)
        async function runWebGPUMiner(challenge, difficulty, address) {
            // ICI se trouverait le code WGSL de 2000 lignes pour faire tourner ta RTX 4060
            // On simule que le GPU a trouvé la bonne réponse après 5 secondes
            return new Promise(resolve => {
                setTimeout(() => {
                    resolve("123456789"); // Le "nonce" gagnant
                }, 5000);
            });
        }
    </script>
</body>
</html>
